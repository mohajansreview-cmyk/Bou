<meta charset="utf-8">
<title>Bou logo concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0E1117; font-family: "Hind Siliguri", system-ui, sans-serif; color: #E6EDF3; }
  .wrap { display: flex; gap: 56px; justify-content: center; padding: 40px 24px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .sub { margin: -14px 0 0; color: #8B949E; font-size: 15px; }
  .icons { display: flex; gap: 22px; align-items: end; }
  .icons figure { margin: 0; text-align: center; font-size: 12px; color: #8B949E; }
  .phone { width: 340px; border-radius: 34px; background: #1B1F26; padding: 14px; box-shadow: 0 0 0 2px #2D333B; }
  .chat { background: #0D1117; border-radius: 22px 22px 8px 8px; height: 170px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .bubble { align-self: flex-end; background: #1E88E5; color: #fff; padding: 8px 14px; border-radius: 16px 16px 4px 16px; font-size: 17px; }
  .input { background: #21262D; border-radius: 20px; padding: 9px 14px; font-size: 16px; color: #E6EDF3; }
  .kb { margin-top: 10px; background: #242A31; border-radius: 12px; padding: 8px 6px 10px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px; color: #C9D1D9; font-size: 15px; }
  .bar .sp { flex: 1; text-align: center; }
  .rows div { display: flex; gap: 5px; justify-content: center; margin-top: 6px; }
  .rows span { background: #3A414A; border-radius: 6px; width: 27px; height: 38px; display: grid; place-items: center; font-size: 15px; }
  .rows .wide { width: 160px; }
</style>

<div class="wrap">
  <!-- Concept 1: newly-wed bride (ghomta, tip, nath), her voice turns into a wave and the word বউ -->
  <div class="col">
    <h2>১. নতুন বউ</h2>
    <p class="sub">ঘোমটা, টিপ আর নথ। মুখের কথা ঢেউ হয়ে লেখা হয়।</p>
    <div class="icons">
      <figure><svg width="112" height="112" viewBox="0 0 120 120"><use href="#bride"/></svg><br>App icon</figure>
      <figure><svg width="48" height="48" viewBox="0 0 120 120"><use href="#bride"/></svg><br>48 px</figure>
      <figure><svg width="20" height="20" viewBox="0 0 120 120"><use href="#bride"/></svg><br>favicon</figure>
    </div>
    <div class="phone">
      <div class="chat"><div class="bubble">আমি আজকে office যাব না</div><div class="input">বউ, কথা কও…</div></div>
      <div class="kb">
        <div class="bar"><svg width="26" height="26" viewBox="0 0 120 120"><use href="#bride"/></svg><span class="sp">বউ · বলো · বলছি</span><span>🎙</span></div>
        <div class="rows">
          <div><span>q</span><span>w</span><span>e</span><span>r</span><span>t</span><span>y</span><span>u</span><span>i</span><span>o</span><span>p</span></div>
          <div><span>a</span><span>s</span><span>d</span><span>f</span><span>g</span><span>h</span><span>j</span><span>k</span><span>l</span></div>
          <div><span>,</span><span class="wide">বাংলা</span><span>.</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Concept 2: "বউ কথা কও" — the Indian cuckoo singing in a speech bubble -->
  <div class="col">
    <h2>২. বউ কথা কও</h2>
    <p class="sub">বউ-কথা-কও পাখি গান গায়, গান লেখা হয়ে যায়।</p>
    <div class="icons">
      <figure><svg width="112" height="112" viewBox="0 0 120 120"><use href="#bird"/></svg><br>App icon</figure>
      <figure><svg width="48" height="48" viewBox="0 0 120 120"><use href="#bird"/></svg><br>48 px</figure>
      <figure><svg width="20" height="20" viewBox="0 0 120 120"><use href="#bird"/></svg><br>favicon</figure>
    </div>
    <div class="phone">
      <div class="chat"><div class="bubble">আমি আজকে office যাব না</div><div class="input">বউ, কথা কও…</div></div>
      <div class="kb">
        <div class="bar"><svg width="26" height="26" viewBox="0 0 120 120"><use href="#bird"/></svg><span class="sp">বউ · বলো · বলছি</span><span>🎙</span></div>
        <div class="rows">
          <div><span>q</span><span>w</span><span>e</span><span>r</span><span>t</span><span>y</span><span>u</span><span>i</span><span>o</span><span>p</span></div>
          <div><span>a</span><span>s</span><span>d</span><span>f</span><span>g</span><span>h</span><span>j</span><span>k</span><span>l</span></div>
          <div><span>,</span><span class="wide">বাংলা</span><span>.</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8102E"/><stop offset="1" stop-color="#6E0A1E"/></linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#29B6F6"/><stop offset=".55" stop-color="#1E88E5"/><stop offset="1" stop-color="#0B1E4A"/></linearGradient>

    <symbol id="bride" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="url(#g-red)"/>
      <!-- ghomta: veil arch with gold border -->
      <path d="M18 104 C18 46 34 18 60 18 C86 18 102 46 102 104 Z" fill="#E23A4F"/>
      <path d="M18 104 C18 46 34 18 60 18 C86 18 102 46 102 104" fill="none" stroke="#F2C14E" stroke-width="5"/>
      <!-- face -->
      <ellipse cx="56" cy="66" rx="22" ry="27" fill="#F6D2B3"/>
      <!-- hair under the veil, sindoor in the parting -->
      <path d="M34 60 C34 44 44 38 56 38 C68 38 78 44 78 60 C72 50 64 46 56 46 C48 46 40 50 34 60 Z" fill="#1A1014"/>
      <path d="M56 38 V46" stroke="#E0102F" stroke-width="2.6"/>
      <!-- lowered eyes -->
      <path d="M45 61 q4 3 8 0 M59 61 q4 3 8 0" fill="none" stroke="#3B2420" stroke-width="2.2" stroke-linecap="round"/>
      <!-- tip -->
      <circle cx="56" cy="53" r="3.4" fill="#C8102E"/>
      <!-- nath (nose ring) -->
      <circle cx="61" cy="70" r="6" fill="none" stroke="#F2C14E" stroke-width="2.6"/>
      <!-- lips -->
      <path d="M50 80 Q56 84 62 80" fill="none" stroke="#B3122E" stroke-width="3" stroke-linecap="round"/>
      <!-- voice wave leaving the lips -->
      <path d="M80 72 q4 6 0 12 M87 66 q8 12 0 24 M94 60 q12 18 0 36" fill="none" stroke="#FFF4D6" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <symbol id="bird" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="url(#g-blue)"/>
      <!-- speech bubble -->
      <path d="M24 28 h72 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-38 l-16 14 v-14 h-18 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" fill="#FFFFFF"/>
      <!-- cuckoo: body, head, tail, open beak -->
      <path d="M30 70 C38 58 52 52 64 54 C70 46 80 44 86 50 L96 48 L88 55 L96 58 L86 60 C84 70 74 78 60 78 C50 78 42 76 30 70 Z" fill="#0B1E4A"/>
      <path d="M30 70 L18 66 L28 76 Z" fill="#0B1E4A"/>
      <circle cx="80" cy="53" r="2.4" fill="#FFFFFF"/>
      <!-- song notes as a small wave -->
      <path d="M100 36 q3 4 0 8 M106 32 q5 8 0 16" fill="none" stroke="#1E88E5" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
