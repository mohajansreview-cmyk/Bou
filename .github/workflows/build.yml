name: Build & Test PixelBoard Patches

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            pixelboard-patches/**/*.gradle*
            pixelboard-patches/**/gradle-wrapper.properties

      # Robolectric downloads a ~100 MB Android jar from Maven Central on every run; back-to-back
      # runs (PR, then main) hit Maven Central's rate limit (HTTP 429). Keep the jar cached.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('pixelboard-patches/**/*.gradle*') }}
          restore-keys: robolectric-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x pixelboard-patches/gradlew

      - name: Run Unit Tests & Wiring Verification
        run: |
          cd pixelboard-patches
          ./gradlew test --info

      - name: Build Android Patch Bundle (.mpp)
        run: |
          cd pixelboard-patches
          ./gradlew :patches:buildAndroid

      - name: Upload Compiled Patch Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixelboard-patches-bundle
          path: pixelboard-patches/patches/build/libs/*.mpp
